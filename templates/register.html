{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="form-layout">
    <div class="form-intro">
        <h1>Create your account</h1>
    </div>
    <form class="panel form-panel" method="post">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" autocomplete="name" minlength="2" maxlength="100" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <small>Use at least 8 characters.</small>
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8"
            required>
        <button class="button button-full" type="submit">Create account</button>
        <p class="form-bottom">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </form>
</section>
{% endblock %}
